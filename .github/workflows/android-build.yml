# Builds the SamTaxco Android app (debug + optional signed release APK).
#
# Triggers
# --------
#   - push to main                                  → debug APK as artifact
#   - tag `v*`                                      → signed release APK
#   - manual workflow_dispatch with release=true    → signed release APK
#
# Required GitHub secrets for release builds:
#   ANDROID_KEYSTORE          base64-encoded .jks keystore
#   ANDROID_KEYSTORE_PASSWORD password to open the keystore
#   ANDROID_KEY_ALIAS         alias of the signing key inside the keystore
#   ANDROID_KEY_PASSWORD      password to use the key
#
# Optional secrets:
#   SAMTAXCO_PROD_URL         e.g. https://samtaxco.app  (defaults to that)
name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Build signed release APK"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      SAMTAXCO_PROD_URL: ${{ secrets.SAMTAXCO_PROD_URL || 'https://samtaxco.app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Capacitor sync (re-render config + copy plugins)
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: samtaxco-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # --- Signed release APK (only when secrets are present) -------------
      - name: Detect release secrets
        id: relsecrets
        if: ${{ github.event.inputs.release == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$ANDROID_KEYSTORE" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE secret missing — skipping release build."
          fi

      - name: Decode keystore
        if: ${{ steps.relsecrets.outputs.has_keystore == 'true' }}
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > android/app/release.keystore
          echo "Keystore decoded ($(wc -c < android/app/release.keystore) bytes)"

      - name: Build release APK
        if: ${{ steps.relsecrets.outputs.has_keystore == 'true' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS:        ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD:     ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PsamtaxcoKeystore=release.keystore \
            -PsamtaxcoKeystorePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -PsamtaxcoKeyAlias="$ANDROID_KEY_ALIAS" \
            -PsamtaxcoKeyPassword="$ANDROID_KEY_PASSWORD"

      - name: Upload release APK
        if: ${{ steps.relsecrets.outputs.has_keystore == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: samtaxco-release-apk
          path: android/app/build/outputs/apk/release/app-release*.apk
          retention-days: 365
          if-no-files-found: warn
